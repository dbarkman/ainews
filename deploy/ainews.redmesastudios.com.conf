# AI News HQ — HTTPS reverse proxy to FastAPI on 127.0.0.1:8006
<VirtualHost *:443>
    ServerName ainews.redmesastudios.com
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/ainews.redmesastudios.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ainews.redmesastudios.com/privkey.pem
    ProxyPass        /.well-known/ !
    ProxyPass        /  http://127.0.0.1:8006/
    ProxyPassReverse /  http://127.0.0.1:8006/
    ErrorLog  /var/log/httpd/ainews_error.log
    CustomLog /var/log/httpd/ainews_access.log combined
</VirtualHost>
<VirtualHost *:80>
    ServerName ainews.redmesastudios.com
    DocumentRoot /var/www/html/ainews-acme
    <Directory /var/www/html/ainews-acme>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/
    RewriteRule ^ https://ainews.redmesastudios.com%{REQUEST_URI} [R=permanent,L]
</VirtualHost>
